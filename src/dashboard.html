<!DOCTYPE html>
<html lang="en"
    class="flex items-center justify-center overflow-y-auto scrollbar-thin scrollbar-thumb-zinc-700 scrollbar-track-zinc-500 ">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="shortcut icon" href="../assests/logo/com.svg" type="image/x-icon">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="main.css">


</head>

<body class="max-w-[500px] bg-zinc-800 p-2 ">
    <h1 class=" font-extrabold text-xl p-3 text-white">Welcome, <span id="greetmessage"
            class="text-2xl  text-blue-700">User</span></h1>
    <div class="flex flex-col items-center justify-center text-[#ffffffd2]">

        <h2 class="flex justify-between w-full text-xl font-bold px-1  rounded-md text-#E2E8F0 "><span>Mid Semester<br>
                Exam</span> <button id="addSubBtn"
                class="bg-[hsl(154,86%,45%)] hover:bg-[hsl(154,86%,55%)] active:scale-95 active:shadow-[0_0_10px_2px_hsl(154,86%,45%,0.4)]  flex justify-center items-center text-2xl  shadow-[0_0_5px_2px_hsl(154,86%,45%,0.3)] text-bold  border-none p-2 text-black   aspect-square h-full text-center rounded-full  cursor-pointer">+</button>
        </h2>
        <div id="midsemcontainer"
            class="flex sm:flex-row flex-wrap sm:w-[300px] bg-[#121214] sm:p-4 m-2 p-1 rounded-md border-solid border-red w-full ">

        </div>
        <div id="overall"
            class="flex sm:flex-row flex-wrap sm:w-[300px] bg-[#121214] sm:p-4 m-2 p-1 rounded-md border-solid border-red w-full ">
            <div class="bg-[#1A1A1E] hover:bg-[hsl(240,5%,20%)] hover:scale-101 shadow-[0_0_6px_1px_rgba(55,55,255,0.1)] rounded-md border-[1px] border-solid border-[#2A2A32] py-1 px-1 w-full">
                <div  class="px-2 flex justify-between py-2 text-amber-400 [text-shadow:_0_0px_20px_#fbbf24] items-center"><span>Overall Percentage :</span><span id="percentage">0.00%</span></div>
                <div id="loadcontainerin"
                    class="  shadow-[0_0_9px_10px_hsl( 120,100%,20%,0.2)]  border-solid border-[1px] text-right  rounded-lg">
                    <div id="overallload" class="   p-1 rounded-sm"></div>
                </div>
            </div>
        </div>

        <button id="logoutBtn"
            class="bg-[#1010d7] hover:bg-blue-600  shadow-[0_0_10px_8px_rgba(55,25,255,0.1)] my-2 border-none p-2 w-4/5 max-w-[500px] rounded-lg text-white cursor-pointer">logout</button>

    </div>
    <h6 class="text-zinc-700 text-center"><br><br>Made for NSUT with 💖 <br>Please report any bug on: eklavya.2026.2008@gmail.com</h6>
    <script type="module" src="./js/dashboard.js"></script>
</body>

</html>

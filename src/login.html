<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="main.css">
    <link rel="shortcut icon" href="../assests/logo/com.svg" type="image/x-icon">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>

<body
    class="flex flex-col w-[100%] justify-center bg-[url(../assests/images/backimg.png)] bg-cover bg-center items-center bg-[#121212] ">
    <div
        class="flex flex-col w-[100%]  rounded-md   h-screen backdrop-blur-sm  [scrollbar-width:none] [&::-webkit-scrollbar]:hidden  items-center py-5 shadow-[0_0_10px_8px_rgba(55,25,255,0.1)] ">
        <h1 class="text-center   w-[100%]  rounded-xs text-xl font-bold p-10 uppercase ">Login</h1>
        <form
            class="backdrop-blur-2xl flex flex-col justify-right w-[90%] max-w-[500px] items-center gap-[10px] border-solid border-[1px] py-8 px-4 rounded-lg shadow-lg">
            <input
                class="hover:bg-zinc-800 bg-[#121212]  shadow-[0_0_10px_8px_rgba(55,25,255,0.1)] border-solid border-[1px] p-2 max-w-[500px] w-4/5 rounded-lg text-white"
                type="email" id="email" placeholder="Email">
            <input
                class="hover:bg-zinc-800 bg-[#121212] hover:bg-blue-600 shadow-[0_0_10px_8px_rgba(55,25,255,0.1)] border-solid border-[1px] p-2 max-w-[500px] w-4/5 rounded-lg text-white"
                type="password" id="password" placeholder="Password">
            <button id="loginBtn"
                class="bg-[#1010d7] hover:bg-blue-600  shadow-[0_0_10px_8px_rgba(55,25,255,0.1)] border-none p-2 w-4/5 max-w-[500px] rounded-lg text-white cursor-pointer">Login</button>
            <button id="registerBtn"
                class="bg-[#1010d7] hover:bg-blue-600  shadow-[0_0_10px_8px_rgba(55,25,255,0.1)] border-none p-2 w-4/5 max-w-[500px] rounded-lg text-white cursor-pointer">Register</button>
        </form>


    </div>

    <h2 class="bg-[#1a1a25] border-none p-2 w-2/5 fixed top-[2px] rounded-lg text-white text-center" id="message"></h2>

    <script type="module" src="./js/login.js"></script>
</body>

</html>
